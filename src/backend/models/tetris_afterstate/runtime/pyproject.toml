[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-sca"
version = "0.1.0"
description = "Timed Tetris simulation and trained MaskablePPO inference"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "gymnasium==1.3.0", "stable-baselines3==2.9.0",
  "sb3-contrib==2.9.0", "torch>=2.7,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
